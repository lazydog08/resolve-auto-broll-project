# Copy this file to config.yaml on each Mac, then fill machine-specific paths.

# Path to the .drt timeline you will import/open in Resolve. The tool never parses
# or edits this file; doctor uses it only to check that the first-run input exists.
timeline_drt: ""

# Folder containing B-roll videos named with explicit A<digits> or C<digits> shot ids.
broll_dir: ""
auto_broll_track_name: "AUTO_BROLL"
shot_id_pad_width: 3
filename_pattern: "(?<![A-Za-z0-9])(?:A|C)(\\d{1,5})(?![0-9])"
allow_partial: false
retime_short_sources: true
heavy_stretch_threshold: 0.5
retime_backend: "auto"
generated_retime_dir: "output/generated_retimes"
clear_target_track: false
duplicate_suffix: "__AUTO_BROLL_v001"
textplus_source_priority:
  - "StyledText"
  - "Notes"
media_type: 1
out_dir: "./reports"
log_level: "INFO"
